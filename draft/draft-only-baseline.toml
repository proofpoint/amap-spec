# draft-only-baseline.toml — obligations the DRAFT states that spec/ does not.
#
# This is a SNAPSHOT, not a reviewed allowlist, and the distinction matters.
# It records the 27 draft-only normative sentences that existed when the
# reverse check was introduced (2026-09-17). They were inspected as a group,
# not individually reasoned about, and they fall into two kinds:
#
#   1. Field-level REQUIRED/OPTIONAL formality. The draft states per-field
#      requirements with RFC 2119 keywords where spec/ states the same facts
#      in its required-vs-optional table without them. Legitimate IETF
#      practice; the fact is in spec/, only the keyword is new.
#   2. Matcher artifacts — the sentence exists on both sides but scores below
#      threshold. Some of these are the same sentence already listed in
#      prose-exceptions.toml from the forward direction.
#
# The value of this file is NOT its contents. It is that any obligation
# appearing in the draft AFTER this snapshot fails the build — which is how a
# hand edit to draft-amap.mkd gets noticed instead of silently becoming a
# requirement no implementation knows about. See WORKFLOWS.md, "Draft-first".
#
# Working this list down is worthwhile: each entry is a place where the draft
# asserts something spec/ does not literally say. Promote it into spec/, or
# reword the draft to match. Do not grow this file — a new entry means the
# reverse check fired and something was baselined instead of decided.


